[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Robinhood Chain (4663). Set ROBINHOOD_RPC_URL in your environment, e.g.
#   export ROBINHOOD_RPC_URL="https://robinhood-mainnet.g.alchemy.com/v2/<KEY>"
# A public fallback is used when the variable is unset.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
